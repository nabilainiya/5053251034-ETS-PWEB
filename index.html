<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7DA7D9">
  <title>myRupiah</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-layout">

    <header class="app-header">
      <a href="#" class="brand" aria-label="myRupiah">
        <span class="brand-my">my</span><span class="brand-rupiah">Rupiah</span>
      </a>

      <div class="header-navigation">
        <nav class="navigation" aria-label="Navigasi utama">
          <button
            class="nav-link active"
            type="button"
            data-page="ringkasan"
            aria-current="page"
          >
            Ringkasan
          </button>

          <button
            class="nav-link"
            type="button"
            data-page="transaksi"
          >
            Transaksi
          </button>
        </nav>

        <div class="today-badge" id="todayDate"></div>
      </div>
    </header>

    <main class="main-content">

      <!-- HALAMAN RINGKASAN -->
      <section class="page active" id="page-ringkasan">
        <div class="page-heading">
          <h1>Ringkasan Keuangan</h1>

          <button
            class="button button-primary"
            type="button"
            id="goToAddTransaction"
          >
            + Tambah Transaksi
          </button>
        </div>

        <div class="summary-grid">
          <article class="summary-card income-card">
            <span class="metric-icon" aria-hidden="true">↗</span>
            <p class="card-label">Total Pemasukan</p>
            <p class="metric-value" id="totalIncome">Rp0</p>
          </article>

          <article class="summary-card expense-card">
            <span class="metric-icon" aria-hidden="true">↙</span>
            <p class="card-label">Total Pengeluaran</p>
            <p class="metric-value" id="totalExpense">Rp0</p>
          </article>

          <article class="summary-card balance-card">
            <span class="metric-icon" aria-hidden="true">Rp</span>
            <p class="card-label">Saldo</p>
            <p class="metric-value" id="totalBalance">Rp0</p>
          </article>
        </div>

        <section class="panel">
          <div class="panel-heading">
            <h2>Transaksi Terbaru</h2>

            <button
              class="text-button"
              type="button"
              data-open-page="transaksi"
            >
              Lihat semua →
            </button>
          </div>

          <div
            class="transaction-list"
            id="recentTransactions"
            aria-live="polite"
          ></div>
        </section>
      </section>

      <!-- HALAMAN TRANSAKSI -->
      <section class="page" id="page-transaksi">
        <div class="page-heading">
          <h1>Transaksi</h1>
        </div>

        <section class="panel">
          <div class="panel-heading">
            <h2>Tambah Transaksi</h2>
          </div>

          <form id="transactionForm">
            <div class="form-grid">

              <div class="form-field">
                <label for="transactionDate">Tanggal</label>
                <input
                  type="date"
                  id="transactionDate"
                  name="date"
                  required
                >
              </div>

              <div class="form-field">
                <label for="transactionType">Jenis Transaksi</label>
                <select
                  id="transactionType"
                  name="type"
                  required
                >
                  <option value="pemasukan">Pemasukan</option>
                  <option value="pengeluaran">Pengeluaran</option>
                </select>
              </div>

              <div class="form-field">
                <label for="transactionCategory">Kategori</label>
                <select
                  id="transactionCategory"
                  name="category"
                  required
                >
                  <option value="Pendapatan Ojol">Pendapatan Ojol</option>
                  <option value="Bonus">Bonus</option>
                  <option value="Bensin">Bensin</option>
                  <option value="Makan dan Minum">Makan dan Minum</option>
                  <option value="Perawatan Kendaraan">Perawatan Kendaraan</option>
                  <option value="Kebutuhan Pribadi">Kebutuhan Pribadi</option>
                  <option value="Tagihan">Tagihan</option>
                  <option value="Lainnya">Lainnya</option>
                </select>
              </div>

              <div class="form-field">
                <label for="transactionAmount">Jumlah (Rp)</label>
                <input
                  type="number"
                  id="transactionAmount"
                  name="amount"
                  min="1"
                  step="1"
                  inputmode="numeric"
                  placeholder="Contoh: 50000"
                  required
                >
              </div>

              <div class="form-field form-field-full">
                <label for="transactionNote">Catatan</label>
                <input
                  type="text"
                  id="transactionNote"
                  name="note"
                  maxlength="120"
                  placeholder="Catatan transaksi (opsional)"
                >
              </div>

            </div>

            <div class="form-actions">
              <button
                class="button button-secondary"
                type="reset"
              >
                Reset
              </button>

              <button
                class="button button-primary"
                type="submit"
              >
                Simpan Transaksi
              </button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>Semua Transaksi</h2>
          </div>

          <div
            class="transaction-list"
            id="allTransactions"
            aria-live="polite"
          ></div>
        </section>
      </section>

      <footer class="main-footer">
        myRupiah © 2026
      </footer>

    </main>
  </div>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
    hidden
  ></div>
</body>
</html>
